name: TelegraphAgent

on:
  schedule:
    - cron: "7 */3 * * *"   # каждые 3 часа в :07 (не пересекается с другими)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telegraph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TelegraphAgent (retry 3x)
        run: |
          for i in 1 2 3; do
            node scripts/telegraph-agent.mjs && break || echo "Попытка $i не удалась, ждём 20s..." && sleep 20
          done