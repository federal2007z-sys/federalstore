name: MarketAgent

on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа
  workflow_dispatch:        # кнопка "Run workflow" в GitHub

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Market Agent
        run: node scripts/agent.mjs

      - name: Push changes
        run: |
          git config user.name "MarketAgent"
          git config user.email "agent@federal-store.ru"
          git add -A
          git diff --cached --quiet || git commit -m "🤖 MarketAgent: автообновление каталога"
          git push origin main