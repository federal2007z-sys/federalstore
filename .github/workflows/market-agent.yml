name: MarketAgent

on:
  schedule:
    - cron: "10 */2 * * *"   # каждые 2 часа в :10 (не пересекается с BossAgent :25 и PromoAgent :00/:30)
  workflow_dispatch:          # кнопка "Run workflow" в GitHub

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "MarketAgent"
          git config user.email "agent@federal-store.ru"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Market Agent (retry 3x)
        run: |
          for i in 1 2 3; do
            node scripts/agent.mjs && break || echo "Попытка $i не удалась, ждём 10s..." && sleep 10
          done

      - name: Push changes (fallback)
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "🤖 MarketAgent: автообновление каталога"
          git push origin main